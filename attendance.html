<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Attendance - Student Information System</title>
</head>
<body data-page="attendance">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <section class="card">
        <div class="summary-row">
          <div><span>Overall attendance</span><strong id="attOverall">-</strong></div>
          <div><span>Minimum required</span><strong id="attMin">-</strong></div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Subject</th><th>Attendance</th><th>Status</th></tr></thead>
            <tbody id="attBody"></tbody>
          </table>
        </div>
      </section>
      <a class="btn btn-ghost btn-back" href="dashboard.html">Back to Dashboard</a>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<script src="app.js"></script>
</body>
</html>
